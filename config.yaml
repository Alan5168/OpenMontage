# OpenMontage - Global Configuration

llm:
  # 2026-07-15: writing/script 主力走本机 LiteLLM 别名 MiniMax-M3-creative
  # (上游仍是 MiniMax-M3，LiteLLM 侧 temperature=0.85)。执行/短答可改用 m3。
  # 接入：OPENAI_BASE_URL=http://127.0.0.1:4000  OPENAI_API_KEY=<LITELLM_MASTER_KEY>
  # 模型 ID：MiniMax-M3-creative
  provider: minimax              # anthropic | openai | gemini | openrouter | ollama | mistral | minimax
  model: MiniMax-M3-creative     # null = provider default; creative = writing 主力
  temperature: 0.85
  max_tokens: 8192

budget:
  mode: warn                     # observe | warn | cap
  total_usd: 10.00
  reserve_pct: 0.10              # holdback for retries / cleanup
  single_action_approval_usd: 0.50
  require_approval_for_new_paid_tool: true

checkpoint:
  policy: guided                 # guided | manual_all | auto_noncreative
  storage_dir: pipeline          # relative to project root

output:
  default_format: mp4
  default_codec: libx264
  default_audio_codec: aac
  default_resolution: "1920x1080"
  default_fps: 30
  default_crf: 23

paths:
  pipeline_dir: pipeline
  library_dir: library
  styles_dir: styles
  skills_dir: skills
  output_dir: output
