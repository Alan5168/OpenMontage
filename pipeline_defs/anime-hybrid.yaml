name: anime-hybrid
version: "0.4"
description: >
  Rebuilt clean-room fiction/anime pipeline using one canonical scene_plan cut id,
  a character/world continuity artifact, and bounded H3/2.5D/programmatic motion routing.
category: animation
stability: beta
default_checkpoint_policy: guided
compatible_playbooks: {recommended: [anime-ghibli], custom_allowed: true}
required_skills:
  - pipelines/anime-hybrid/executive-producer
  - pipelines/anime-hybrid/proposal-director
  - pipelines/anime-hybrid/scene-director
  - pipelines/anime-hybrid/asset-director
  - pipelines/anime-hybrid/quality-director
  - meta/reviewer
  - meta/checkpoint-protocol
orchestration: {mode: executive-producer, skill: pipelines/anime-hybrid/executive-producer, budget_default_usd: 5.0, max_revisions_per_stage: 3, max_send_backs: 2, max_wall_time_minutes: 360}
extensions: {custom_scripts: true, custom_playbooks: true, custom_skills: true, custom_tools: false}
metadata:
  lifecycle_owner: OpenMontage
  human_touchpoints: [script, scene_plan, visual_review, final_gate]
  limited_anime_studio: true
  visual_constraint_gate: minimum_visual_contract
  archaeology_source: clean_room_reconstruction_not_directory_copy
stages:
  - {name: commission, skill: pipelines/anime-hybrid/executive-producer, produces: [brief], tools_available: [], checkpoint_required: true, human_approval_default: false}
  - {name: research, skill: pipelines/anime-hybrid/executive-producer, required_artifacts_in: [brief], produces: [research_brief], tools_available: [], checkpoint_required: true, human_approval_default: false}
  - {name: content_architecture, skill: pipelines/anime-hybrid/executive-producer, required_artifacts_in: [research_brief], produces: [content_architecture], tools_available: [], checkpoint_required: true, human_approval_default: false}
  - {name: proposal, skill: pipelines/anime-hybrid/proposal-director, required_artifacts_in: [content_architecture], produces: [proposal_packet, decision_log], tools_available: [], checkpoint_required: true, human_approval_default: false}
  - {name: script, skill: pipelines/anime-hybrid/executive-producer, required_artifacts_in: [content_architecture, proposal_packet], produces: [script], tools_available: [], checkpoint_required: true, human_approval_default: true}
  - {name: visual_development, skill: pipelines/anime-hybrid/executive-producer, required_artifacts_in: [script], produces: [visual_development], tools_available: [image_selector], checkpoint_required: true, human_approval_default: false}
  - {name: scene_plan, skill: pipelines/anime-hybrid/scene-director, required_artifacts_in: [script, visual_development], produces: [scene_plan], tools_available: [image_selector], checkpoint_required: true, human_approval_default: true}
  - {name: assets, skill: pipelines/anime-hybrid/asset-director, required_artifacts_in: [scene_plan, visual_development], produces: [asset_manifest], tools_available: [image_selector, video_selector, video_compose], checkpoint_required: true, human_approval_default: false, review_focus: ["Cuts that fail the visual-constraint gate stay in planning", "video_selector and video_compose must not run without approved stills"], success_criteria: [Only production-ready cuts leave planning]}
  - {name: edit, skill: pipelines/anime-hybrid/asset-director, required_artifacts_in: [scene_plan, asset_manifest], produces: [edit_decisions], tools_available: [subtitle_gen, audio_mixer, video_compose], checkpoint_required: true, human_approval_default: false}
  - {name: compose, skill: pipelines/anime-hybrid/asset-director, required_artifacts_in: [edit_decisions, asset_manifest], produces: [render_report], tools_available: [video_compose, audio_mixer, video_stitch], checkpoint_required: true, human_approval_default: false}
  - name: visual_review
    skill: pipelines/anime-hybrid/quality-director
    required_artifacts_in: [render_report]
    produces: [creative_intent_contract, frame_packet, editorial_critique]
    tools_available: [video_analyzer]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - Frames come from the actual mp4 including t=0 and dialogue anchors
      - Critique cites timestamps against frozen intent; text-only render_success is not SEE
      - LIMITED held frames are grammar, not freeze-frame defects
      - Prime/Pi/Trae may write CRITIQUE and PATCH_PROPOSAL, never APPROVED
    success_criteria: [Schema-valid frame_packet with existing image files, Critique findings are timestamped]
  - name: repair_plan
    skill: pipelines/anime-hybrid/quality-director
    required_artifacts_in: [editorial_critique, creative_intent_contract]
    produces: [repair_plan]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Plan names failed cuts only
      - I2V_HARD is the only class that may request H3
      - PATCH_PROPOSAL cannot skip to APPROVED
    success_criteria: [Schema-valid repair_plan]
  - name: patch
    skill: pipelines/anime-hybrid/quality-director
    required_artifacts_in: [repair_plan]
    produces: [patch_receipt]
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Receipt records draft hash
      - Unrelated LIMITED holds were not regenerated
    success_criteria: [Schema-valid patch_receipt]
  - name: rerender
    skill: pipelines/anime-hybrid/asset-director
    required_artifacts_in: [patch_receipt, edit_decisions, asset_manifest]
    produces: [render_report]
    tools_available: [video_compose, audio_mixer, video_stitch]
    checkpoint_required: true
    human_approval_default: false
    reentry: {of: compose, max_cycles: 1, required_cycle: true}
    review_focus:
      - Output hash differs from the draft compose hash
      - Machine gates re-run on the new hash
    success_criteria: [after_sha256 differs from before_sha256]
  - {name: independent_qa, skill: pipelines/anime-hybrid/quality-director, required_artifacts_in: [render_report, scene_plan, editorial_critique], produces: [final_review], tools_available: [video_analyzer], checkpoint_required: true, human_approval_default: false}
  - {name: final_gate, skill: pipelines/anime-hybrid/quality-director, required_artifacts_in: [final_review, render_report], produces: [final_gate], tools_available: [], checkpoint_required: true, human_approval_default: true}
  - {name: publish_package, skill: pipelines/anime-hybrid/quality-director, required_artifacts_in: [final_gate, render_report], produces: [publish_log], tools_available: [export_bundle], checkpoint_required: true, human_approval_default: false}
