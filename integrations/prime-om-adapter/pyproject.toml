[project]
name = "om-prime-adapter"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["jsonschema"]

[project.scripts]
om_prime_adapter = "om_prime_adapter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/om_prime_adapter"]
